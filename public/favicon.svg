<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F5FE0" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2F5FE0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#12141C" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#glow)" />

  <!-- R letterform, built from bold strokes so it holds up at tiny sizes -->
  <rect x="18" y="14" width="9" height="36" rx="2.5" fill="#F6F7FB" />
  <path d="M27,14 h5 a10,10 0 0 1 0,20 h-5" fill="none" stroke="#F6F7FB" stroke-width="9" stroke-linecap="round" />
  <path d="M26,33 L41,50" stroke="#F6F7FB" stroke-width="9" stroke-linecap="round" fill="none" />

  <!-- motion sparks off the leg — the same speed-line language used in the flow strip -->
  <line x1="44" y1="46" x2="53" y2="50" stroke="#FF4C46" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <line x1="46" y1="39" x2="56" y2="41" stroke="#FF4C46" stroke-width="3" stroke-linecap="round" opacity="0.55" />
  <line x1="47" y1="32" x2="58" y2="32" stroke="#FF4C46" stroke-width="3" stroke-linecap="round" opacity="0.3" />
</svg>
